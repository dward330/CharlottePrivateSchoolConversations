<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare Charlotte-area private schools across sports, the arts, student clubs, and college support."
    />
    <title>Charlotte School Insights</title>

    <!-- Site-wide SEO / social defaults. src/lib/head.ts OVERRIDES every one of
         these per route at runtime, and scripts/prerender.mjs bakes the
         per-page values into each file in dist/ — so what a crawler or a
         link-preview scraper downloads is already page-specific. These are the
         fallback for any route that somehow renders without that effect.
         og:image and canonical must be ABSOLUTE: social scrapers ignore
         relative URLs. -->
    <link rel="canonical" href="https://charlotteschoolinsights.com/" />
    <meta property="og:site_name" content="Charlotte School Insights" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Charlotte School Insights" />
    <meta
      property="og:description"
      content="Compare Charlotte-area private schools across sports, the arts, student clubs, and college support."
    />
    <meta property="og:url" content="https://charlotteschoolinsights.com/" />
    <meta property="og:image" content="https://charlotteschoolinsights.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charlotte School Insights" />
    <meta
      name="twitter:description"
      content="Compare Charlotte-area private schools across sports, the arts, student clubs, and college support."
    />
    <meta name="twitter:image" content="https://charlotteschoolinsights.com/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600;700&display=swap"
    />
    <!-- Pin the saved theme before first paint so there's no light/dark flash.
         Mirrors src/lib/theme.ts; with nothing saved we fall through to the
         prefers-color-scheme rules in index.css until React mounts. -->
    <script>
      try {
        var t = localStorage.getItem('cs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <!-- Suppress the pre-rendered ENGLISH markup for a non-English reader,
         before the browser paints it.

         Every page in dist/ is pre-rendered in English (scripts/prerender.mjs)
         so crawlers get real content. That markup is on disk, so the browser
         paints it immediately — while React can only replace it after the
         locale catalog loads. `await ready` in src/main.tsx gates React's
         render, NOT the browser's paint of static HTML, so a Spanish reader
         loading a bare /school/cannon/ saw English for ~20-60ms first (measured
         under 6x CPU throttle: English headline on screen at +120ms, Spanish at
         +180ms). Before pre-rendering there was no such flash — the shell was
         empty — so this is a regression the pre-render introduced, not a
         pre-existing i18n issue.

         Same shape as the theme pin above: read the preference before first
         paint. We hide rather than translate — this must stay tiny and
         dependency-free — and src/lib/i18n.ts reveals it again once the catalog
         is live. English readers (the overwhelming majority, and every crawler)
         are untouched and still get an instant paint of real content.

         Mirrors the resolution order in i18n.ts: ?lang= wins, then the saved
         choice, then the browser's languages. Kept deliberately loose — any
         non-'en' match hides, because a false positive costs one paint while a
         false negative shows the wrong language. If JS is off, nothing runs and
         the English content stays visible, which is the right fallback. -->
    <script>
      ;(function () {
        try {
          var pick = null
          var q = /[?&]lang=([^&#]+)/.exec(location.search)
          if (q) pick = decodeURIComponent(q[1])
          if (!pick) pick = localStorage.getItem('csc.lang')
          if (!pick && navigator.languages) pick = navigator.languages[0]
          if (!pick) pick = navigator.language
          if (pick && pick.toLowerCase().split('-')[0] !== 'en') {
            document.documentElement.setAttribute('data-i18n-pending', '')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* Paired with the script above. Only the pre-rendered body is hidden;
         the page keeps its background so this reads as a normal load, not a
         blank flash. Cleared by src/lib/i18n.ts when the catalog is live, and
         by an animation-driven failsafe below if that never happens. */
      html[data-i18n-pending] body {
        visibility: hidden;
      }
      /* Failsafe: if the catalog never loads (bundle 404, offline), reveal the
         English content anyway rather than stranding the reader on a blank
         page. A CSS animation needs no JS to fire, so this holds even if the
         module that clears the attribute never runs at all. */
      @keyframes i18n-reveal {
        to {
          visibility: visible;
        }
      }
      html[data-i18n-pending] body {
        animation: i18n-reveal 0s linear 2s forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics — privacy-first, cookieless traffic stats
         (visits, unique-visitor counts, per-page views, visitor country). Free.
         Dashboard: Cloudflare → Analytics → Web analytics, site
         charlotteschoolinsights.com. See src/lib/analytics.ts for the SPA
         page-view hook this app needs on top of the beacon.
         (Token was 1fd5db08… while the site lived at dward330.github.io; Cloudflare
         issues one token per site, so moving to the custom domain changed it.) -->
    <script
      type="module"
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "9f82699093284a7084d5fbd2aeda1457", "spa": true}'
    ></script>
  </body>
</html>
